<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Camera Body Silhouette -->
  <rect x="96" y="140" width="320" height="250" rx="44" fill="#090a0f" stroke="url(#ringGrad)" stroke-width="6"/>
  <!-- Flash/sensor notch -->
  <path d="M 180,140 L 204,104 L 308,104 L 332,140 Z" fill="#090a0f" stroke="url(#ringGrad)" stroke-width="6"/>

  <!-- Small Flash element -->
  <circle cx="150" cy="180" r="12" fill="#38bdf8" opacity="0.9"/>
  <!-- Red Recording/Sensor Dot -->
  <circle cx="360" cy="180" r="8" fill="#ef4444"/>

  <!-- Camera Outer Lens Rim -->
  <circle cx="256" cy="265" r="95" fill="#11131a" stroke="url(#ringGrad)" stroke-width="6"/>

  <!-- Camera Inner Optical Glass -->
  <circle cx="256" cy="265" r="75" fill="url(#lensGrad)"/>

  <!-- Translucent Pose Ghost Alignment Overlay inside Lens -->
  <!-- Head -->
  <circle cx="256" cy="225" r="18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <!-- Torso & Pose -->
  <line x1="256" y1="243" x2="256" y2="295" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <line x1="256" y1="258" x2="230" y2="290" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <line x1="256" y1="258" x2="282" y2="285" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <line x1="256" y1="295" x2="236" y2="335" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <line x1="256" y1="295" x2="276" y2="335" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- Optical Lens Flare Glare -->
  <path d="M 215,220 A 60 60 0 0 1 295,220" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round"/>
</svg>
